# Same as docker-compose.devci.yml (without the nginx proxy) plus file polling,
# useful when file change events are not propagated into the container.
volumes:
  node-modules-volume:

x-dev-service: &dev-service
  build:
    context: .
    dockerfile: Dockerfile.devci
  image: openebench-nuxt3:devci
  user: ${DEV_UID:-0}:${DEV_GID:-0}
  volumes:
    - .:/app
    - node-modules-volume:/app/node_modules

services:
  npm_ci_deps:
    <<: *dev-service
    command: npm ci

  nuxt:
    <<: *dev-service
    depends_on:
      npm_ci_deps:
        condition: service_completed_successfully
    restart: on-failure
    ports:
      - '3001:3001'
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
      AUTH_ORIGIN: 'http://localhost:3001'
      APP_BASE_URL: 'http://localhost:3001'
      NUXT_AUTH_SECRET: '${NUXT_AUTH_SECRET:-local-dev-only-secret-change-me}'
