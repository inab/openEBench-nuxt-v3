version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: ghcr.io/inab/openebench-nuxt-v3:test2
    environment:
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET must be set}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:?SMTP_USER must be set}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD must be set}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM must be set}
      SMTP_TO: ${SMTP_TO:?SMTP_TO must be set}
    network_mode: host