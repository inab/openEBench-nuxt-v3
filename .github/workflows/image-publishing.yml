name: Create and publish openEBench3 Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-openebench-web-image:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository ⏰
        uses: actions/checkout@v7

      - name: Setup node env 🏗
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: false

      - name: Set IMAGE_NAME to lowercase ✨
        id: set_image_name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Debug checkout state 🔍
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          echo "Branch/ref: ${{ github.ref }}"
          echo "package-lock.json md5: $(md5sum package-lock.json)"
          echo "npm version on runner: $(npm --version)"
          echo "npm version in node:22-alpine: $(docker run --rm node:22-alpine npm --version)"

      - name: Cache node_modules 📦
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node }}-

      - name: Install dependencies 👨🏻‍💻
        run: npm ci

      - name: Run unit tests locally 🧪
        run: npm run test -- -- --watch=false

      - name: Log in to the Container Registry ☕️
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker ⌨
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image 📦
        id: push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile.production
          push: true
          no-cache: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:test2
          labels: ${{ steps.meta.outputs.labels }}