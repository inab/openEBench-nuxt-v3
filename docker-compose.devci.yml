volumes:
  node-modules-volume:

x-dev-service: &dev-service
  build:
    context: .
    dockerfile: Dockerfile.devci
  image: openebench-nuxt3:devci
  # Set DEV_UID/DEV_GID to your ids so files written to the repo are not owned by root
  user: ${DEV_UID:-0}:${DEV_GID:-0}
  volumes:
    - .:/app
    - node-modules-volume:/app/node_modules

services:
  npm_ci_deps:
    <<: *dev-service
    command: npm ci

  npm_install_deps:
    <<: *dev-service
    profiles:
      - manual
    command: npm install ${DEPENDENCIES:-YOU_NEED_TO_PROVIDE_YOUR_DEPENDENCIES_THROUGH_DEPENDENCIES_VARIABLE_TO_DOCKER_COMPOSE}

  npm_uninstall_deps:
    <<: *dev-service
    profiles:
      - manual
    command: npm uninstall ${DEPENDENCIES:-YOU_NEED_TO_PROVIDE_YOUR_DEPENDENCIES_THROUGH_DEPENDENCIES_VARIABLE_TO_DOCKER_COMPOSE}

  npm_run:
    <<: *dev-service
    profiles:
      - manual
    command: npm run ${NPM_RUN:-lint:fix}

  nuxt:
    <<: *dev-service
    depends_on:
      npm_ci_deps:
        condition: service_completed_successfully
    restart: on-failure
    environment:
      AUTH_ORIGIN: 'http://localhost:3001'
      APP_BASE_URL: 'http://localhost:3001'
      OEB_CONFIG_FILE: /app/config/devci.json
      NUXT_AUTH_SECRET: '${NUXT_AUTH_SECRET:-local-dev-only-secret-change-me}'
    ports:
      - 3001:3001

  proxy:
    image: nginx:1.27-bookworm
    depends_on:
      - nuxt
    volumes:
      - ./nginx.conf.devci:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '8080:80'
